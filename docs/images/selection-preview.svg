<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Selector de área de LeerTexto</title>
  <desc id="desc">Vista de la superposición para seleccionar un área de pantalla.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#12b3a8" stroke-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#12b3a8" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="520" fill="#101114"/>
  <rect width="1280" height="520" fill="url(#grid)" opacity="0.8"/>
  <rect width="1280" height="520" fill="#05070b" opacity="0.46"/>
  <g transform="translate(260 116)" filter="url(#glow)">
    <rect width="760" height="260" rx="6" fill="none" stroke="#12b3a8" stroke-width="3"/>
    <path d="M0 24V0H24" fill="none" stroke="#f0b35a" stroke-width="4"/>
    <path d="M760 236V260H736" fill="none" stroke="#f0b35a" stroke-width="4"/>
  </g>
  <g transform="translate(32 414)">
    <rect width="368" height="74" rx="8" fill="#101217" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="18" y="30" fill="#ffffff" font-family="Inter, Segoe UI, Arial" font-size="17" font-weight="800">Seleccionar área</text>
    <text x="18" y="55" fill="#c4cad4" font-family="Inter, Segoe UI, Arial" font-size="15">Arrastra para capturar texto. ESC cancela</text>
  </g>
</svg>
